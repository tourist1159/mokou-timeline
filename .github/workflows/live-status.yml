name: Live Status Checker

on:
  schedule:
    # GitHub Actions cron の最小粒度(5分)で実行。実際の発火は GitHub 側の負荷で
    # 多少遅れることがある("best effort")。
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check live status
        run: python check_live.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_status.json
          if git diff --cached --quiet; then
            echo "変化なし"
            exit 0
          fi
          git commit -m "Update live status [skip ci]"
          git pull --rebase
          git push
