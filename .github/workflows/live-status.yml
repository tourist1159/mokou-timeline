name: Live Status Checker

on:
  schedule:
    # cron はもう「数珠が切れたときの保険」でしかない。1分間隔のチェックは job 自体を
    # GitHub-hosted runner の上限(6時間)近くまで走らせ続けることで実現し、次の run は
    # ループの最後に自分で workflow_dispatch する(下の「次の run を起動」ステップ)。
    #
    # 以前は */15 で撃ち直していたが、この account では schedule イベントが大幅に
    # 間引かれており(2026-08-29 実測: 1日22回程度しか発火せず、ライブ判定に3〜5時間の
    # 空白ができていた)、cron を頼りにできない。加えて cron が発火するたびに
    # cancel-in-progress で走行中の run が打ち切られるため、頻度が高いと逆に邪魔になる。
    # 保険としては2時間に1回で十分。:00 は GitHub 全体で最も混む時刻なのでずらしてある。
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status
  # 新しい run が(遅れて)始まったら古い run を打ち切って引き継ぐ。
  # 古い run は誤って残っても実害はない(次のループで同じ内容をcommitしようとして
  # 差分無しでスキップされるだけ)が、二重にAPIを叩き続けるのは無駄なので止める。
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub-hosted runner の1job上限(6時間)近くまで。setup分の余裕を見て355分。
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # YouTube のライブ判定に yt-dlp の flat 抽出 (/streams タブの一覧取得) を使う。
      # ページ取得(HTML解析)は Actions のIPからだと配信中でも痕跡が返らないため
      # 判定に使えない (check_live.py 冒頭の説明を参照)。
      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # DISPATCH_PAT がどのワークフローを起動できるかをログに残す。存在しない ref で
      # workflow_dispatch を投げるだけなので、実際には何も起動しない (422が返る=権限あり)。
      - name: DISPATCH_PAT の権限を確認 (起動はしない)
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: python check_live.py --check-dispatch

      - name: Check live status (1分おきにループ)
        env:
          # setup分・最後のpush分を差し引いた、job内で回せる時間(340分)。
          LOOP_SECONDS: "20400"
          INTERVAL_SECONDS: "60"
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # 配信終了検知時に kick-comment-fetcher / twitch-archive-fetcher /
          # youtube-comment-fetcher の Actions を起動するための PAT (Actions:write権限、対象3repoに限定推奨)
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
          # 各fetcher(kick/twitch/youtube-meta)の起動要否を確認する間隔。実際に起動するのは
          # 「前回の実行から1時間以上経っている」ものだけ(check_live.py の dispatch_archives)。
          # fetcher側にも毎時cronはあるが、GitHubのスケジューラに間引かれて6〜12時間に1回しか
          # 発火しないため、常時動いているこのループから面倒を見る。
          ARCHIVE_CHECK_SECONDS: "600"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$SECONDS
          next_dispatch=0   # run 開始直後に1回確認する (cron の空白で溜まった分を早く回収する)
          while :; do
            python check_live.py
            git add live_status.json
            if git diff --cached --quiet; then
              echo "変化なし (commit せず)"
            else
              git commit -m "Update live status [skip ci]"
              git pull --rebase
              git push
            fi
            elapsed=$(( SECONDS - start ))
            if [ "$elapsed" -ge "$next_dispatch" ]; then
              python check_live.py --dispatch-archives
              next_dispatch=$(( elapsed + ARCHIVE_CHECK_SECONDS ))
            fi
            if [ "$elapsed" -ge "$LOOP_SECONDS" ]; then
              echo "ループ終了 (${elapsed}秒) — 次の run に引き継ぐ"
              break
            fi
            sleep "$INTERVAL_SECONDS"
          done

      # cron が当てにならないため、ループを最後まで回せたら次の run を自分で起動する。
      # 打ち切られた run (cancel-in-progress で新しい run に引き継いだ場合) では起動しない
      # ＝ 二重に走らせないため success() 限定にしている。
      - name: 次の run を起動 (cron に頼らない数珠つなぎ)
        if: success()
        env:
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: python check_live.py --dispatch-self
