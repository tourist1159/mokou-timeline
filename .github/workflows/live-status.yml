name: Live Status Checker

on:
  schedule:
    # 実測: GitHub Actions の schedule は高頻度(5分おき)だと数十分〜1時間近く
    # ずれ込むことがある("best effort"、公式ドキュメントにも明記されている実際の挙動)。
    # そのためこの cron はあくまで「たまに撃ち直すきっかけ」でしかなく、実際の1分間隔
    # ループは下の job 自体を GitHub-hosted runner の上限(6時間)近くまで長時間
    # 走らせ続けることで実現する。cron がどれだけ遅れても、走っている job が
    # そのあいだ1分おきにチェックし続けるので検知の隙間ができない。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status
  # 新しい run が(遅れて)始まったら古い run を打ち切って引き継ぐ。
  # 古い run は誤って残っても実害はない(次のループで同じ内容をcommitしようとして
  # 差分無しでスキップされるだけ)が、二重にAPIを叩き続けるのは無駄なので止める。
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub-hosted runner の1job上限(6時間)近くまで。setup分の余裕を見て355分。
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check live status (1分おきにループ)
        env:
          # setup分・最後のpush分を差し引いた、job内で回せる時間(340分)。
          LOOP_SECONDS: "20400"
          INTERVAL_SECONDS: "60"
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          # 配信終了検知時に kick-comment-fetcher / twitch-archive-fetcher /
          # youtube-comment-fetcher の Actions を起動するための PAT (Actions:write権限、対象3repoに限定推奨)
          DISPATCH_PAT: ${{ secrets.DISPATCH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$SECONDS
          while :; do
            python check_live.py
            git add live_status.json
            if git diff --cached --quiet; then
              echo "変化なし (commit せず)"
            else
              git commit -m "Update live status [skip ci]"
              git pull --rebase
              git push
            fi
            elapsed=$(( SECONDS - start ))
            if [ "$elapsed" -ge "$LOOP_SECONDS" ]; then
              echo "ループ終了 (${elapsed}秒) — 次の run に引き継ぐ"
              break
            fi
            sleep "$INTERVAL_SECONDS"
          done
