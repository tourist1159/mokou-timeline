<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>もこう アーカイブタイムライン</title>
  <meta name="description" content="もこうの YouTube 動画・配信、Kick 配信、Twitch 配信を時系列でまとめて表示" />
  <!-- サイト自身がライト/ダーク両方に自前で対応していることをブラウザに明示する。
       これが無いと、一部のモバイルブラウザ(Android Chromeの「ウェブページを自動的に
       ダーク化」等)が端末側でページを強制的にダーク化してしまい、ライトを選んでも
       白くならない現象が起きる。style.css側の color-scheme と合わせて二重に明示。 -->
  <meta name="color-scheme" content="light dark" />
  <script>
    // CSS読み込み前にテーマを決定して <html data-theme> に反映する(ライト/ダーク切替時の
    // 一瞬の色チラつき防止)。app.js側の applyTheme() と同じロジックだが、CSSより先に
    // 実行する必要があるため独立して持つ。"system" (未設定) なら何もせず、CSSの
    // prefers-color-scheme に任せる。
    (function () {
      try {
        var raw = localStorage.getItem("mokou-timeline:settings");
        var theme = raw ? JSON.parse(raw).theme : null;
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=16" />
</head>
<body>
  <header class="site-header">
    <h1>もこう アーカイブタイムライン</h1>
    <p class="tagline">YouTube の動画・配信、Kick・Twitch の配信を、まとめて時系列で。</p>
    <div id="stats" class="stats"></div>
  </header>

  <div id="live-banner" class="live-banner" hidden></div>

  <div class="controls">
    <!-- モバイルでは controls-primary だけスクロール追従させる (controls-secondary は追従しない)。
         デスクトップでは display:contents になり、見た目は分割前と同じ1つの並びになる。 -->
    <div class="controls-primary">
      <div class="control-group" id="filter-platform" data-key="platform">
        <span class="control-label">配信元</span>
        <button class="chip active" data-value="all">すべて</button>
        <button class="chip" data-value="youtube">YouTube</button>
        <button class="chip" data-value="kick">Kick</button>
        <button class="chip" data-value="twitch">Twitch</button>
      </div>

      <div class="control-group" id="filter-type" data-key="type">
        <span class="control-label">種別</span>
        <button class="chip active" data-value="all">すべて</button>
        <button class="chip" data-value="stream">配信</button>
        <button class="chip" data-value="video">動画</button>
      </div>
    </div>

    <div class="controls-secondary">
      <div class="control-group" id="filter-channel" data-key="channel">
        <span class="control-label">チャンネル</span>
        <button class="chip active" data-value="all">すべて</button>
        <!-- チャンネルのチップは app.js が動的に追加 -->
      </div>

      <div class="control-group">
        <span class="control-label">並び</span>
        <button class="chip active" id="sort-toggle" data-order="desc">新しい順</button>
      </div>

      <div class="control-group search-group">
        <input type="search" id="search" placeholder="タイトルで検索…" autocomplete="off" />
      </div>

      <div class="control-group settings-group">
        <button class="settings-btn" id="settings-btn" type="button" aria-haspopup="true" aria-expanded="false">⚙️ 表示設定</button>
        <div class="settings-panel" id="settings-panel" hidden>
          <div class="settings-row">
            <span class="control-label">カラーテーマ</span>
            <div class="control-group" id="theme-toggle" data-key="theme">
              <button class="chip active" data-value="system">端末に合わせる</button>
              <button class="chip" data-value="light">ライト</button>
              <button class="chip" data-value="dark">ダーク</button>
            </div>
          </div>
          <div class="settings-row">
            <span class="control-label">表示形式</span>
            <div class="control-group" id="view-toggle" data-key="view">
              <button class="chip active" data-value="grid">グリッド</button>
              <button class="chip" data-value="list">リスト</button>
            </div>
          </div>
          <label class="settings-toggle">
            <input type="checkbox" id="toggle-timeline" />
            左に時間軸を表示
          </label>
          <label class="settings-toggle">
            <input type="checkbox" id="toggle-newmarker" />
            新着の境界線を表示
          </label>
          <label class="settings-toggle">
            <input type="checkbox" id="toggle-comments" />
            コメント数・グラフボタンを表示
          </label>
        </div>
      </div>
    </div>
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>

  <div id="empty" class="empty" hidden>該当するアイテムがありません。</div>

  <footer class="site-footer">
    <span id="footer-note"></span>
  </footer>

  <script src="chart/chart.umd.js?v=7"></script>
  <script src="app.js?v=14"></script>
  <script src="commentgraph.js?v=8"></script>
</body>
</html>
